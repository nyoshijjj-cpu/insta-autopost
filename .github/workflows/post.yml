name: Instagram 自動投稿

on:
  schedule:
    # 月・水・金 20:00(日本時間)= 11:00(UTC)
    # ※ GitHub の混雑で数分〜数十分遅れることがあります
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テストだけ(実際には投稿しない)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow pillow-heif

      - name: 画像をインスタ用に整える
        run: python scripts/post.py --prepare

      - name: 整えた画像を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898981+github-actions[bot]@users.noreply.github.com"
          git add -A posts
          if ! git diff --cached --quiet; then
            git commit -m "画像をインスタ用に変換"
            git push
          fi
          echo "POST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 投稿する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/post.py --dry-run
          else
            python scripts/post.py
          fi

      - name: 投稿済みに移動したことを保存
        if: success()
        run: |
          git add -A posts
          if ! git diff --cached --quiet; then
            git commit -m "投稿済み: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
